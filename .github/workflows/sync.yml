name: Espejo Exacto GitHub a Google Drive

on:
  push:
    branches:
      - main

jobs:
  rclone-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo de mi repositorio
        uses: actions/checkout@v4

      - name: Instalar rclone en el servidor virtual
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar accesos de Google Drive
        env:
          GDRIVE_JSON: ${{ secrets.GDRIVE_CREDENTIALS }}
        run: |
          mkdir -p ~/.config/rclone
          
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}" >> ~/.config/rclone/rclone.conf
          echo "service_account_credentials = $GDRIVE_JSON" >> ~/.config/rclone/rclone.conf
          
          # Forzamos a que use el almacenamiento del propietario de la carpeta y no del robot
          echo "upload_cutoff = 0" >> ~/.config/rclone/rclone.conf

      - name: Sincronizar clonando de forma estricta
        run: |
          rclone sync . gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-use-trash=false \
            --drive-keep-revision-forever=false \
            --verbose

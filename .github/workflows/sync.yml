name: Espejo Exacto GitHub a Google Drive Personal

on:
  push:
    branches:
      - main

jobs:
  rclone-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo de mi repositorio
        uses: actions/checkout@v4

      - name: Instalar rclone en el servidor virtual
        run: sudo apt-get update && sudo apt-get install -y rclone

      - name: Configurar accesos de Google Drive Personal
        run: |
          mkdir -p ~/.config/rclone
          
          echo "[gdrive]" > ~/.config/rclone/rclone.conf
          echo "type = drive" >> ~/.config/rclone/rclone.conf
          echo "scope = drive" >> ~/.config/rclone/rclone.conf
          echo "client_id = ${{ secrets.GDRIVE_CLIENT_ID }}" >> ~/.config/rclone/rclone.conf
          echo "client_secret = ${{ secrets.GDRIVE_CLIENT_SECRET }}" >> ~/.config/rclone/rclone.conf
          echo "root_folder_id = ${{ secrets.GDRIVE_FOLDER_ID }}" >> ~/.config/rclone/rclone.conf
          echo "token = {\"access_token\":\"\",\"token_type\":\"Bearer\",\"refresh_token\":\"${{ secrets.GDRIVE_REFRESH_TOKEN }}\",\"expiry\":\"2026-01-01T00:00:00Z\"}" >> ~/.config/rclone/rclone.conf

      - name: Sincronizar clonando de forma estricta
        run: |
          rclone sync . gdrive: \
            --exclude ".git/**" \
            --exclude ".github/**" \
            --drive-use-trash=false \
            --verbose

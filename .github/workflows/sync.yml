name: Espejo Exacto GitHub a Google Drive

on:
  push:
    branches:
      - main

jobs:
  sync-gdrive:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo de mi repositorio
        uses: actions/checkout@v4

      - name: Subir y Reemplazar Archivos en Google Drive
        uses: adityak74/google-drive-upload-git-action@v2.2.2
        with:
          credentials: ${{ secrets.GDRIVE_CREDENTIALS }}
          parent_folder_id: ${{ secrets.GDRIVE_FOLDER_ID }}
          target: '.'
          overwrite: true
